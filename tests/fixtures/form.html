<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Local form fixture</title></head>
<body><main>
<h1>Applicant information</h1>
<form id="form">
  <label>Applicant Name <input id="applicant" autocomplete="name"></label>
  <label>Email Address <input type="email" value="existing@example.test"></label>
  <label>Manager Email <input type="email"></label>
  <label>OTP <input autocomplete="one-time-code"></label>
  <label>Favorite text editor <input></label>
  <label>Password <input type="password"></label>
  <label>Full Name <input id="hidden" style="display:none"></label>
  <label>What is your highest qualification? <input id="qualification"></label>
  <label>Personal portfolio URL <textarea></textarea></label>
  <label>Country <select><option value="">Choose</option><option value="IN">India</option></select></label>
  <fieldset><legend>Favorite beverage</legend><label><input name="drink" type="radio" value="tea">Tea</label><label><input name="drink" type="radio" value="coffee">Coffee</label></fieldset>
  <label><input type="checkbox">I agree to terms</label>
  <div><span>ZIP</span><div><input id="location-zip" placeholder="94103"></div></div>
  <div><span>Website</span><input type="text" value="https://" placeholder="https://" id="website-link"></div>
  <div><span>Twitter</span><input type="url" name="twitterUrl" id="twitter-link" placeholder="https://twitter.com/username"></div>
  <label>Project name <input></label>
  <label>Project description <textarea></textarea></label>
  <label>Live project URL <input type="url"></label>
  <label>Portfolio or LinkedIn <input placeholder="yoursite.com"></label>
  <label>Resume <input placeholder="Link to your resume (Google Drive, Notion, your site)"></label>
  <label>Anything we should know? <textarea placeholder="The most interesting system you have built, or anything else."></textarea></label>
  <button type="submit">Submit</button>
</form>
<button id="signup" onclick="document.querySelector('#signup-dialog').showModal()">Open signup</button>
<dialog id="signup-dialog">
  <form method="dialog">
    <label>Email *<input type="email"></label>
    <label>Name <span>(optional)</span><input autofocus placeholder="John Doe"></label>
    <label>LinkedIn URL <span>(optional)</span><input type="url"></label>
    <label><input type="checkbox">I agree to the privacy policy</label>
    <button type="button">Leave name</button>
  </form>
</dialog>
<button id="step">Next step</button>
<button id="rerender">Replace name field</button>
<button id="outside">Leave field</button>
<iframe title="Embedded form" src="./frame.html"></iframe>
<section aria-labelledby="reference-title"><h2 id="reference-title">References</h2><label>Email <input id="reference-email" type="email"></label></section>
<div id="react"></div>
<div id="shadow"></div>
<script type="module" src="./form.tsx"></script>
</main></body></html>
